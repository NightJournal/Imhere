<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Imhere globe" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Imhere logo: a small watercolour globe on a stand. Hand-authored SVG, no external art. -->
  <defs>
    <filter id="wc" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="9"/>
      <feColorMatrix values="0 0 0 0 .4 0 0 0 0 .35 0 0 0 0 .4 0 0 0 .18 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <radialGradient id="sea" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#F2FAFD"/><stop offset=".45" stop-color="#C9E4F0"/><stop offset="1" stop-color="#9CC9DE"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="58" cy="52" r="34"/></clipPath>
  </defs>
  <!-- stand -->
  <path d="M28 66 A34 34 0 0 0 88 74" fill="none" stroke="#C99A7A" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M60 87 L60 99" stroke="#C99A7A" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="60" cy="103" rx="17" ry="4.5" fill="#D9AE8F"/>
  <!-- ball -->
  <circle cx="58" cy="52" r="35.5" fill="none" stroke="#BDE8F6" stroke-width="2"/>
  <circle cx="58" cy="52" r="36.8" fill="none" stroke="#D7C8F4" stroke-width="1.2"/>
  <circle cx="58" cy="52" r="34" fill="url(#sea)"/>
  <g clip-path="url(#ball)" filter="url(#wc)" opacity=".92">
    <path d="M34 30 C44 22 58 22 66 28 C70 34 62 38 64 44 C58 48 50 44 46 50 C40 52 36 44 30 44 Z" fill="#BFE0C6"/>
    <path d="M48 32 C54 30 60 33 60 37 C55 40 50 38 48 32 Z" fill="#F4C3A8"/>
    <path d="M66 46 C74 44 82 50 82 58 C78 66 70 64 66 58 Z" fill="#F7E3C1"/>
    <path d="M44 58 C50 56 56 62 54 70 C50 80 44 82 42 74 C40 68 40 62 44 58 Z" fill="#F4C3A8"/>
    <path d="M70 70 C76 70 80 74 78 80 C72 82 68 78 70 70 Z" fill="#DCCBF2"/>
    <path d="M72 30 C78 30 84 36 84 42 C80 42 76 38 72 30 Z" fill="#CFE7C9"/>
  </g>
  <circle cx="58" cy="52" r="34" fill="#fff" filter="url(#grain)" opacity=".6"/>
  <ellipse cx="45" cy="36" rx="9" ry="5" fill="#fff" opacity=".45" transform="rotate(-30 45 36)"/>
  <!-- sparkle -->
  <path d="M100 14 C101 20 102 21 108 22 C102 23 101 24 100 30 C99 24 98 23 92 22 C98 21 99 20 100 14 Z" fill="#E9B95B"/>
  <path d="M108 34 C108.5 37 109 37.5 112 38 C109 38.5 108.5 39 108 42 C107.5 39 107 38.5 104 38 C107 37.5 107.5 37 108 34 Z" fill="#F2A585"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
